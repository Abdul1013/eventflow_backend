name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Type-check ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @eventflow/api exec tsc --noEmit
      - run: pnpm --filter @eventflow/web-admin exec tsc --noEmit
      - run: pnpm --filter @eventflow/web-attendee exec tsc --noEmit

  # ─── Backend Unit & Integration Tests ───────────────────────────────────────
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventflow
          POSTGRES_PASSWORD: eventflow_test
          POSTGRES_DB: eventflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://eventflow:eventflow_test@localhost:5432/eventflow_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_min_32_chars_here_ok
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_chars_here_ok
      HMAC_SECRET: ci_hmac_secret_for_qr_token_32_chars_
      RESEND_API_KEY: re_ci_placeholder
      CLOUDINARY_URL: cloudinary://key:secret@cloud
      SAO_ENGINE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5174
      ADMIN_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventflow/api db:generate
      - run: pnpm --filter @eventflow/api db:migrate:prod
      - run: pnpm --filter @eventflow/api test

  # ─── Python SAO Engine Tests ─────────────────────────────────────────────────
  test-sao:
    name: SAO Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r apps/sao-engine/requirements.txt
      - run: python -m pytest apps/sao-engine/tests/ -v || echo "No tests yet"
